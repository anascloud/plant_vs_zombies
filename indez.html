                    const x = 100 + i * 72; g.fillStyle = sel == k ? '#fff59a' : '#c9a36b'; g.fillRect(x, 5, 66, 86); g.fillStyle = '#3a5a2a'; g.fillRect(x + 3, 8, 60, 62); g.save(); g.beginPath(); g.rect(x + 3, 8, 60, 62); g.clip(); g.translate(x + 33, 40); g.scale(.62, .62); dp(k, 0, 0, { t: 0, hp: 1800 }); g.restore(); T(P[k].cost + '', x + 33, 87, 17, '#2a1a08');
                    if (cdt[k] > 0 || sun < P[k].cost) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x, 5, 66, cdt[k] > 0 ? 86 * cdt[k] / P[k].cd : 86) }
                });
                g.fillStyle = shov ? '#fff59a' : '#c9a36b'; g.fillRect(822, 5, 74, 86); T('Shovel', 859, 55, 15, '#2a1a08'); T('⛏', 859, 36, 24, '#222');
                g.fillStyle = '#222'; g.fillRect(640, 106 - 100 + 86, 0, 0);
                mw.forEach((m, r) => { if (m && (!m.used || m.on)) { const y = Y0 + r * CH + CH / 2; g.fillStyle = '#c22'; g.fillRect(m.x - 18, y - 10, 40, 24); g.fillStyle = '#ddd'; g.fillRect(m.x - 22, y - 18, 10, 10); C(m.x - 10, y + 16, 8, '#222'); C(m.x + 14, y + 16, 8, '#222') } });
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 9; c++) { const p = grid[r][c]; if (p) { if (L.th == 'pool' && (r == 2 || r == 3)) E(X0 + c * CW + CW / 2, Y0 + r * CH + CH / 2 + 36, 34, 10, '#2f9a3a'); dp(p.type, X0 + c * CW + CW / 2, Y0 + r * CH + CH / 2, p) } }
                    zs.filter(z => z.r == r).forEach(dz); if (L.th == 'pool' && (r == 2 || r == 3)) { g.fillStyle = 'rgba(40,120,200,.45)'; g.fillRect(X0, Y0 + r * CH + CH * .55, 9 * CW, CH * .45) }
                }
                if (sel && scene == 'play') { const c = Math.floor((mx - X0) / CW), r = Math.floor((my - Y0) / CH); if (c >= 0 && c < 9 && r >= 0 && r < 5 && L.rows.includes(r) && !grid[r][c]) { g.globalAlpha = .5; dp(sel, X0 + c * CW + CW / 2, Y0 + r * CH + CH / 2, { t: 1, hp: 1800 }); g.globalAlpha = 1 } }
                ps.forEach(p => C(p.x, p.y, 8, p.s ? '#8fdcff' : '#7ed23a'));
                fx.forEach(f => { g.globalAlpha = Math.min(1, f.t * 2); C(f.x, f.y, f.R * (1.2 - f.t), '#ff9a1f'); C(f.x, f.y, f.R * .6 * (1.2 - f.t), '#ffe066'); g.globalAlpha = 1 });
                { const th = L.th; if (th == 'night') { g.fillStyle = 'rgba(5,10,45,.45)'; g.fillRect(0, 100, W, 500) } else if (th == 'fog') { const gr = g.createLinearGradient(X0 + 4 * CW, 0, W, 0); gr.addColorStop(0, 'rgba(220,230,235,0)'); gr.addColorStop(1, 'rgba(220,230,235,.7)'); g.fillStyle = gr; g.fillRect(X0 + 4 * CW, 100, W - X0 - 4 * CW, 500) } else if (th == 'desert') { g.fillStyle = 'rgba(255,170,60,.12)'; g.fillRect(0, 100, W, 500) } else if (th == 'forest') { g.fillStyle = 'rgba(10,50,10,.2)'; g.fillRect(0, 100, W, 500) } else if (th == 'snow') { flakes.forEach(f => { f.y += f.s * .8; f.x += Math.sin(t + f.y * .02) * .5; if (f.y > 600) { f.y = 100; f.x = Math.random() * 900 } C(f.x, f.y, f.s + 1, 'rgba(255,255,255,.9)') }) } }
                ss.forEach(sunD);
                g.fillStyle = '#222'; g.fillRect(660, 575, 220, 14); g.fillStyle = '#7ed23a'; g.fillRect(662, 577, 216 * Math.max(0, (spawned - zs.length)) / L.n, 10); T('Level ' + (lvl + 1) + '/' + LV.length, 650, 588, 16, '#fff', 'right');
                if (msgT > 0) T(msg, W / 2, 320, 34, '#ff3b2f'); if (sel || shov) T(shov ? 'Click a plant to dig it up' : 'Click a lawn tile to plant', W / 2, 590, 18, '#fff')
            }
            if (scene == 'play' && t < 4) T('Collect the falling suns and stop the zombies!', W / 2, 300, 26, '#fff');
            if (scene != 'play') { g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, 600); g.fillStyle = '#5a3a18'; g.fillRect(200, 120, 500, 360); g.strokeStyle = '#e9d8a6'; g.lineWidth = 5; g.strokeRect(200, 120, 500, 360) }
            if (scene == 'menu') { T('PLANTS vs ZOMBIES', 450, 200, 52, '#8fe04a'); T('Easy Edition', 450, 248, 30, '#ffe066'); dp('peashooter', 340, 340, {}); dp('sunflower', 450, 340, {}); dp('wallnut', 560, 340, { hp: 1800 }); T('Start: 100 levels, 7 worlds (M = mute)', 450, 440, 22, '#fff') }
            if (scene == 'intro') { const k = LV[lvl].nw; T('Level ' + (lvl + 1) + ' – ' + (LV[lvl].th || 'day').toUpperCase(), 450, 185, 40, '#ffe066'); T(lvl == 0 ? 'Only the middle lane is attacked' : lvl == 1 ? 'Three lanes this time' : 'All five lanes', 450, 225, 20, '#fff'); if (k) { T('New plant: ' + P[k].n, 450, 275, 26, '#8fe04a'); dp(k, 450, 355, { t: 0, hp: 1800 }); T('Cost ' + P[k].cost + ' sun', 450, 420, 20, '#fff') } else T('Good luck!', 450, 340, 30, '#8fe04a'); T('Click to begin', 450, 462, 20, '#fff') }
            if (scene == 'win') { T(lvl < LV.length - 1 ? 'Level cleared!' : 'You saved the lawn!', 450, 230, 40, '#8fe04a'); T(lvl < LV.length - 1 ? 'Click for the next level' : 'All levels complete. Click to return to menu', 450, 300, 22, '#fff') }
            if (scene == 'lose') { T('THE ZOMBIES ATE YOUR BRAINS!', 450, 250, 32, '#ff5a4a'); T('Click to try again', 450, 320, 24, '#fff') }
        }

        function click(x, y) {
            if (scene == 'menu') { lvl = 0; scene = 'intro'; return } if (scene == 'intro') { start(lvl); return } if (scene == 'win') { if (lvl < LV.length - 1) { lvl++; scene = 'intro' } else scene = 'menu'; return } if (scene == 'lose') { scene = 'intro'; return }
            const L = LV[lvl]; for (let i = ss.length - 1; i >= 0; i--)if (Math.hypot(ss[i].x - x, ss[i].y - y) < 34) { ss.splice(i, 1); sun += 25; sfx('sun'); return }
            if (y < 95) { L.pl.forEach((k, i) => { const cx = 100 + i * 72; if (x >= cx && x < cx + 66 && cdt[k] <= 0 && sun >= P[k].cost) { sel = sel == k ? null : k; shov = 0 } }); if (x >= 820) { shov = !shov; sel = null } return }
            const c = Math.floor((x - X0) / CW), r = Math.floor((y - Y0) / CH); if (c < 0 || c > 8 || r < 0 || r > 4 || !L.rows.includes(r)) return;
            if (shov && grid[r][c]) { grid[r][c] = null; shov = 0 } else if (sel && !grid[r][c]) { const q = P[sel]; sun -= q.cost; cdt[sel] = q.cd; sfx('plant'); grid[r][c] = { type: sel, hp: q.hp, t: sel == 'sunflower' ? 6 : sel == 'potatomine' ? 6 : sel == 'cherrybomb' || sel == 'jalapeno' ? 1 : 0 }; sel = null }
        }
        function pos(e) { const r = cv.getBoundingClientRect(); mx = (e.clientX - r.left) * W / r.width; my = (e.clientY - r.top) * 600 / r.height }
        cv.addEventListener('pointerdown', e => { ac(); pos(e); click(mx, my) }); cv.addEventListener('pointermove', pos);
        function loop(ts) { const d = Math.min(.05, (ts - last) / 1000 || 0); last = ts; upd(d); draw(); requestAnimationFrame(loop) } requestAnimationFrame(loop);
    </script>
